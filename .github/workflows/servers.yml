name: Hourly server check

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Shares a queue with the monthly save, so two runs never push at once.
    concurrency:
      group: data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # The latest main, in case this run waited behind another that saved something.
          ref: main
          sparse-checkout: |
            tracker
            config
            scripts
            data/servers.json
            data/live.json
            data/files/*/info.json
          sparse-checkout-cone-mode: false

      - name: Ask the trackers and check the servers
        run: python3 tracker/update_servers.py

      # A server that came back at a new address under exactly the same name keeps its file
      # listing: its folder moves to the new address instead of being indexed again.
      - name: Move file listings of servers that changed address
        id: moves
        run: |
          if [ -s data/moves.json ]; then
            python3 -c 'import json; [print(m[k].replace(":", "_")) for m in json.load(open("data/moves.json")) for k in ("from", "to")]' |
              while read -r dir; do git sparse-checkout add "data/files/$dir/"; done
            python3 tracker/apply_moves.py
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi

      # The server list is saved whenever it changes (at most once a day per server); this
      # hour's user counts only once a day, so GitHub keeps a daily snapshot without 24 commits.
      - name: Save to GitHub
        run: |
          paths="data/servers.json"
          if [ "$(date -u +%H)" = "00" ]; then paths="$paths data/live.json"; fi
          scripts/save-data.sh "Server list $(date -u +%Y-%m-%d)" $paths

      - name: Upload to DreamHost
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH_WWW: ${{ vars.DEPLOY_PATH_WWW }}
          DEPLOY_PATH_TRACKER: ${{ vars.DEPLOY_PATH_TRACKER }}
        run: scripts/deploy.sh data

      # The search index knows servers by address, so a move needs a full rebuild.
      - name: Rebuild search after a move
        if: steps.moves.outputs.moved == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY"
