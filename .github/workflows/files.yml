name: Monthly file index

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:
    inputs:
      servers:
        description: "Only these servers (host:port, separated by spaces). Blank for the servers that are due."
        required: false
        default: ""
      everything:
        description: "Re-index every listed server, not only the ones that are due"
        type: boolean
        default: false

permissions:
  contents: write

# GitHub's schedule and the DreamHost timer can both start this on the 1st; the second waits
# for the first, then only finds the servers that are still missing.
concurrency:
  group: file-index
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.plan.outputs.servers }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The latest main, not the commit from when this run was created: a run that waited
          # behind another must see what that one saved.
          ref: main
          sparse-checkout: |
            tracker
            config
            data/servers.json
            data/live.json
            data/files/*/info.json
          sparse-checkout-cone-mode: false
      # The monthly run only indexes servers that aren't in the index yet.
      - id: plan
        env:
          ONLY: ${{ inputs.servers }}
          EVERYTHING: ${{ inputs.everything }}
        run: |
          if [ -n "$ONLY" ]; then
            servers=$(python3 tracker/index_files.py --plan $ONLY)
          elif [ "$EVERYTHING" = "true" ]; then
            servers=$(python3 tracker/index_files.py --plan --all)
          else
            # Due: never indexed, an unfinished pass, or last indexed over 45 days ago.
            servers=$(python3 tracker/index_files.py --plan)
          fi
          echo "servers=$servers" >> "$GITHUB_OUTPUT"
          echo "$servers"

  # One job per machine (usually one server): a huge server can take hours without holding up the
  # rest, one that hangs only loses its own listing, and a machine running several servers isn't
  # logged into several times at once.
  index:
    needs: plan
    if: needs.plan.outputs.servers != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        server: ${{ fromJSON(needs.plan.outputs.servers) }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The latest main, not the commit from when this run was created: a run that waited
          # behind another must see what that one saved.
          ref: main
          sparse-checkout: |
            tracker
            config
            data/servers.json
            data/live.json
            data/files/*/info.json
            data/files/*/next/
          sparse-checkout-cone-mode: false
      # Results go to results/ (one folder per server), never into data/files directly, so the
      # save job only ever touches the servers this job worked on.
      - name: Index ${{ matrix.server }}
        env:
          SERVERS: ${{ matrix.server }}
        run: python3 tracker/index_files.py $SERVERS --job-time 19800 --out results
      - uses: actions/upload-artifact@v7
        with:
          name: files-${{ strategy.job-index }}
          path: results/
          retention-days: 3
          include-hidden-files: false

  save:
    needs: index
    if: always() && needs.index.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          pattern: files-*
          path: results
          merge-multiple: true
      - name: Replace the listings that worked
        run: python3 tracker/merge_results.py results
      - name: Save to GitHub
        run: scripts/save-data.sh "File index $(date -u +%Y-%m-%d)" data/files config/archives.txt
      - name: Upload to DreamHost
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH_WWW: ${{ vars.DEPLOY_PATH_WWW }}
          DEPLOY_PATH_TRACKER: ${{ vars.DEPLOY_PATH_TRACKER }}
        run: scripts/deploy.sh index
