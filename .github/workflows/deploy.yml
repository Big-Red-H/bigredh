name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "config/noindex.txt"
      - "tracker/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Check the PHP
        run: for f in $(find site -name '*.php'); do php -l "$f" > /dev/null || exit 1; done
      - name: Upload both sites to DreamHost
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH_WWW: ${{ vars.DEPLOY_PATH_WWW }}
          DEPLOY_PATH_TRACKER: ${{ vars.DEPLOY_PATH_TRACKER }}
        run: scripts/deploy.sh all
